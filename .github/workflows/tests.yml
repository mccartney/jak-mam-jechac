name: tests

# Unit tests for the app and for the GTFS preprocessing, on every PR and on main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: App unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: ./gradlew --no-daemon :app:testDebugUnitTest

  preprocess:
    name: Preprocess tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - run: python3 -m unittest discover -v preprocess/tests
