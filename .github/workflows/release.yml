name: release

# Push a vX.Y.Z tag (or publish a release in the UI) → signed APK (sideload) and AAB (upload to Google Play by hand)
# on a GitHub Release. Installed apps learn about updates from Google Play (in-app updates), not from us.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release

env:
  TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags: versionName/versionCode come from git

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build signed APK and AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.JMJ_KEYSTORE_BASE64 }}
          JMJ_KEYSTORE: ${{ runner.temp }}/release.jks
          JMJ_KEYSTORE_PASSWORD: ${{ secrets.JMJ_KEYSTORE_PASSWORD }}
          JMJ_KEY_ALIAS: ${{ secrets.JMJ_KEY_ALIAS }}
          JMJ_KEY_PASSWORD: ${{ secrets.JMJ_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$JMJ_KEYSTORE"
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
          cp app/build/outputs/apk/release/app-release.apk jak-mam-jechac.apk
          cp app/build/outputs/bundle/release/app-release.aab jak-mam-jechac.aab

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made in the GitHub UI also pushes the tag; attach to it rather than fail.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" jak-mam-jechac.apk jak-mam-jechac.aab --clobber
          else
            gh release create "$TAG" jak-mam-jechac.apk jak-mam-jechac.aab --generate-notes
          fi

